<script>
const tg = window.Telegram && Telegram.WebApp;
const inTg = Boolean(tg && tg.initData);
if (tg) { tg.ready(); tg.expand(); document.documentElement.dataset.theme = tg.colorScheme === 'dark' ? 'dark' : 'light'; }

const T = {
  ru: { tCatalog: 'Каталог', tCart: 'Корзина', tOrders: 'Заказы', tAi: 'AI-подбор', tAdmin: 'Админка', all: 'Все', search: 'Поиск кофе и чая',
        inStock: n => `В наличии ${n} шт.`, low: n => `Осталось ${n}`, out: 'Нет в наличии', empty: 'Ничего не нашлось',
        checkout: s => `Оформить · ${s}`, noMore: 'Больше нет в наличии', addBtn: 'В корзину', from: 'от', variants: 'вар.', total: 'Итого',
        err: 'Не получилось загрузить. Проверьте интернет и попробуйте ещё раз.', retry: 'Обновить',
        notTg: 'Откройте магазин из Telegram — кнопка «🛍 Магазин» в чате с ботом.',
        cartTitle: 'Корзина', cartEmpty: 'Корзина пока пуста', toCatalog: 'Перейти в каталог',
        checkoutNote: 'Оплата картой или СБП через ЮKassa — безопасно.',
        ordersTitle: 'Мои заказы', ordersEmpty: 'Заказов пока нет', delivery: 'Доставка',
        aiTitle: 'Подберём кофе', aiPh: 'Опишите вкус: кислинка или мягкость, как завариваете, для себя или в подарок…', aiGo: 'Подобрать', aiWait: 'Подбираю',
        aiHints: ['Мягкий кофе без кислоты для турки', 'Подарок любителю чая до 2 000 ₽', 'Что-то фруктовое для воронки'], aiNone: 'Под запрос ничего не нашлось — попробуйте описать иначе' },
  en: { tCatalog: 'Catalog', tCart: 'Cart', tOrders: 'Orders', tAi: 'AI pick', tAdmin: 'Admin', all: 'All', search: 'Search coffee and tea',
        inStock: n => `In stock: ${n}`, low: n => `Only ${n} left`, out: 'Out of stock', empty: 'Nothing found',
        checkout: s => `Checkout · ${s}`, noMore: 'No more in stock', addBtn: 'Add to cart', from: 'from', variants: 'options', total: 'Total',
        err: 'Could not load. Check your connection and try again.', retry: 'Retry',
        notTg: 'Open the shop from Telegram — the «🛍 Магазин» button in the bot chat.',
        cartTitle: 'Cart', cartEmpty: 'Your cart is empty', toCatalog: 'Go to catalog',
        checkoutNote: 'Pay by card or SBP via ЮKassa — secure.',
        ordersTitle: 'My orders', ordersEmpty: 'No orders yet', delivery: 'Delivery',
        aiTitle: 'Find your coffee', aiPh: 'Describe the taste: bright or smooth, how you brew, for yourself or as a gift…', aiGo: 'Find', aiWait: 'Thinking',
        aiHints: ['Smooth low-acid coffee for a cezve', 'A gift for a tea lover under 2 000 ₽', 'Something fruity for a pour-over'], aiNone: 'Nothing matched — try describing it differently' },
};
let lang = 'ru', L = T.ru;
const tt = (ru, en) => (lang === 'en' ? en : ru);
let products = [], cart = {}, cat = null, query = '', tab = 'catalog', orders = null;
let shopInfo = null, sortBy = '', onlyStock = false, coReady = false;

const $ = id => document.getElementById(id);
const tr = (ru, en) => (lang === 'en' ? en : ru);
const rub = k => Math.round(k / 100).toLocaleString('ru-RU') + ' ₽';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const nm = p => (lang === 'en' && p.name_en) || p.name;
const ds = p => (lang === 'en' && p.description_en) || p.description || '';
const ct = p => (lang === 'en' && p.category_en) || p.category || '';
const baseOf = p => !p.group_key ? nm(p) : (lang === 'en' && p.name_en ? p.name_en.split(' · ')[0] : p.group_key);
const optOf = p => (lang === 'en' && p.option_label_en) || p.option_label || '';
const siblings = p => p.group_key ? products.filter(x => x.group_key === p.group_key && !x.is_addon) : [p];
const isW = p => Boolean(p && p.unit);
const stepOf = p => isW(p) ? Math.max(1, p.step || 1) : 1;
const minOf = p => isW(p) ? Math.max(1, p.min_qty || 1) : 1;
const UNIT = { g: { ru: 'г', en: 'g', bigRu: 'кг', bigEn: 'kg' }, ml: { ru: 'мл', en: 'ml', bigRu: 'л', bigEn: 'l' } };
const gram = (n, u = 'g') => { const x = UNIT[u] || UNIT.g; return n >= 1000 ? (n / 1000).toLocaleString(lang === 'en' ? 'en-GB' : 'ru-RU') + ' ' + (lang === 'en' ? x.bigEn : x.bigRu) : n + ' ' + (lang === 'en' ? x.en : x.ru); };
const unitShort = u => (UNIT[u] || UNIT.g)[lang === 'en' ? 'en' : 'ru'];
const qtyText = (p, q) => isW(p) ? gram(q, p.unit) : String(q);
const priceHtml = p => isW(p) ? `${rub(p.price * 100)}<small class="per"> / 100 ${unitShort(p.unit)}</small>` : rub(p.price);
const priceText = p => isW(p) ? `${rub(p.price * 100)} / 100 ${unitShort(p.unit)}` : rub(p.price);
const opt2Of = p => (lang === 'en' && p.option2_label_en) || p.option2_label || '';
const bundleSum = p => (p.bundle || []).reduce((a, b) => a + (b.price || 0) * b.qty, 0);
const bundleSave = p => Math.max(0, bundleSum(p) - p.price);
const bName = b => (lang === 'en' && b.name_en) || b.name;
const addonsFor = p => products.filter(a => a.is_addon && a.stock > 0 && a.id !== p.id && String(a.addon_for || '*').split('|').map(x => x.trim()).some(k => k === '*' || k === p.group_key || k === p.name));
const byId = id => products.find(x => x.id == id);
const when = s => { if (!s) return ''; const d = new Date(String(s).replace(' ', 'T') + 'Z'); return isNaN(d) ? '' : d.toLocaleString(lang === 'en' ? 'en-GB' : 'ru-RU', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }); };

async function api(path, body, tries = 3) {
  for (let i = 0; ; i++) {
    try {
      const r = await fetch('/shop-api' + path, {
        method: body ? 'POST' : 'GET',
        headers: { 'Content-Type': 'application/json', 'X-Init-Data': tg?.initData || '' },
        body: body ? JSON.stringify(body) : undefined,
      });
      const d = await r.json().catch(() => ({}));
      if (r.status === 401) { const e = new Error(L.notTg); e.fatal = true; throw e; }
      if (!r.ok) { const e = new Error(d.error || L.err); e.fatal = r.status < 500; throw e; }
      return d;
    } catch (e) {
      // сервер мог перезапускаться (обновление) — пробуем ещё пару раз
      if (e.fatal || i >= tries - 1) throw e;
      await new Promise(r => setTimeout(r, 1200 * (i + 1)));
    }
  }
}
const ERR_EN = { 'Такого промокода нет (в демо — KOFE10)': 'No such promo code (in the demo — KOFE10)', 'Корзина пуста': 'Your cart is empty', 'Проверьте номер телефона': 'Please check the phone number', 'Для чека укажите телефон или e-mail': 'Please enter a phone or e-mail for the receipt', 'Выберите город': 'Choose a city', 'Укажите адрес: улица, дом, квартира': 'Enter the address: street, house, flat', 'Выберите перевозчика': 'Choose a carrier', 'Далеко: по расстоянию возим до 30 км. Выберите СДЭК или Почту': 'Too far: distance delivery covers up to 30 km. Choose CDEK or Russian Post', 'Этот заказ уже не ждёт оплату': 'This order is no longer awaiting payment', 'Заказ не найден': 'Order not found' };
function toast(t) { if (lang === 'en' && ERR_EN[t]) t = ERR_EN[t]; const el = $('toast'); const ref = document.body.classList.contains('open') ? null : (document.querySelector('.composer') || document.querySelector('.tabs')); if (ref) { el.style.top = 'auto'; el.style.bottom = Math.round(innerHeight - ref.getBoundingClientRect().top + 10) + 'px'; } else { el.style.bottom = 'auto'; el.style.top = '16px'; } el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 1800); }
function haptic(kind) { try { tg?.HapticFeedback?.impactOccurred(kind || 'light'); } catch {} }

const NOIMG = `<div class="noimg">♨️</div>`;
const EMO = [[/чай|tea|матча|пуэр/i, '🍵'], [/кофе|coffee|эспрессо/i, '☕'], [/набор|подар|set|gift/i, '🎁'], [/сироп|концентрат|лимонад/i, '🧃']];
const emoOf = p => { if (p.bundle && p.bundle.length) return '🎁'; const t = [p.category, p.group_key, p.name].join(' '); const m = EMO.find(([re]) => re.test(t)); return m ? m[1] : '♨️'; };
const photo = p => p && p.photo ? `<img src="${esc(p.photo)}" alt="" loading="lazy" onerror="this.outerHTML=NOIMG">` : `<div class="noimg">${emoOf(p || {})}</div>`;

function applyLang() {
  L = T[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-t]').forEach(el => el.textContent = L[el.dataset.t]);
  document.querySelectorAll('#lang button').forEach(b => b.classList.toggle('on', b.dataset.lang === lang));
  $('q').placeholder = L.search;
  $('demoBar').textContent = tr('Демо: данные не настоящие. Промокод KOFE10 — скидка 10%.', 'Demo: sample data only. Promo code KOFE10 gives 10% off.');
  document.querySelectorAll('#roleSw button').forEach(b => { b.textContent = b.dataset.role === 'owner' ? tr('Владелец', 'Owner') : tr('Покупатель', 'Buyer'); });
  const rs = $('roleSw'); if (rs) rs.setAttribute('aria-label', tr('Режим демо', 'Demo mode'));
  $('aiTitle').textContent = L.aiTitle; $('aiQ').placeholder = L.aiPh; $('aiGo').textContent = L.aiGo;
  $('aiHints').innerHTML = L.aiHints.map(h => `<button class="chip" data-hint="${esc(h)}">${esc(h)}</button>`).join('');
}

/* ---------- каталог ---------- */
function stockTag(p) {
  if (p.stock <= 0) return `<span class="tag out">${L.out}</span>`;
  if (isW(p) ? p.stock <= 1000 : p.stock <= 3) return `<span class="tag low">${L.low(isW(p) ? gram(p.stock, p.unit) : p.stock)}</span>`;
  return '';
}
function ctrl(p) {
  const q = cart[p.id] || 0;
  if (p.stock < minOf(p)) return `<button class="add" disabled>+</button>`;
  if (!q) return `<button class="add" data-add="${p.id}" aria-label="${L.addBtn}">+</button>`;
  return `<div class="step"><button data-dec="${p.id}">−</button><span>${qtyText(p, q)}</span><button data-add="${p.id}">+</button></div>`;
}
// карточка товара с вариантами: аккуратные «таблетки» вариантов и цена «от», вместо сухого «2 вар.»
function variantsCard(p) {
  const sib = siblings(p);
  const first = sib.reduce((a, x) => (x.price * (isW(x) ? 100 : 1) < a.price * (isW(a) ? 100 : 1) ? x : a));
  const o1 = [...new Set(sib.map(optOf).filter(Boolean))], o2 = [...new Set(sib.map(opt2Of).filter(Boolean))];
  const pills = o1.slice(0, 3).map(v => `<i>${esc(v)}</i>`).join('') + (o1.length > 3 ? `<i>+${o1.length - 3}</i>` : '') + o2.slice(0, 2).map(v => `<i class="alt">${esc(v)}</i>`).join('');
  return `<div class="vpills">${pills}</div>
    <div class="row"><div class="price"><small>${L.from}</small> ${priceText(first)}</div><span class="pick">${lang === 'en' ? 'Choose' : 'Выбрать'}</span></div>`;
}
const cardHtml = p => `
  <article class="card ${p.stock <= 0 ? 'out' : ''}" data-open="${p.id}">
    <div class="ph">${photo(p)}${stockTag(p)}${p.bundle && p.bundle.length ? `<span class="kind gift">${bundleSave(p) ? (lang === 'en' ? 'Save ' : 'Выгода ') + rub(bundleSave(p)) : (lang === 'en' ? 'Set' : 'Набор')}</span>` : ''}${isW(p) ? `<span class="kind">${p.unit === 'ml' ? (lang === 'en' ? 'by volume' : 'на розлив') : (lang === 'en' ? 'by weight' : 'на развес')}</span>` : ''}</div>
    <div class="info">
      ${ct(p) ? `<div class="cat">${esc(ct(p))}</div>` : ''}
      <div class="name">${esc(baseOf(p))}</div>
      ${p.group_key && siblings(p).length > 1 ? variantsCard(p)
      : `${p.bundle && p.bundle.length ? `<div class="inside">${lang === 'en' ? 'Inside' : 'Внутри'}: ${p.bundle.slice(0, 3).map(b => esc(bName(b).split(' · ')[0])).join(', ')}${p.bundle.length > 3 ? ' …' : ''}</div>` : ''}
        <div class="row"><div class="price">${priceHtml(p)}${bundleSave(p) ? `<div class="was">${rub(bundleSum(p))}</div>` : ''}</div><div data-ctrl="${p.id}">${ctrl(p)}</div></div>`}
    </div>
  </article>`;
function renderTools() {
  const ru = lang !== 'en';
  $('tools').innerHTML = `<select id="sortSel" aria-label="${ru ? 'Сортировка' : 'Sort'}">
      <option value="" ${!sortBy ? 'selected' : ''}>${ru ? 'Сначала популярные' : 'Popular first'}</option>
      <option value="asc" ${sortBy === 'asc' ? 'selected' : ''}>${ru ? 'Сначала дешевле' : 'Cheapest first'}</option>
      <option value="desc" ${sortBy === 'desc' ? 'selected' : ''}>${ru ? 'Сначала дороже' : 'Most expensive first'}</option></select>
    <button class="chip ${onlyStock ? 'on' : ''}" data-stockonly>${ru ? 'Только в наличии' : 'In stock only'}</button>`;
  $('sortSel').onchange = e => { sortBy = e.target.value; renderGrid(); };
}
function renderInfo() {
  const i = shopInfo, ru = lang !== 'en', bits = [];
  if (i && i.freeFrom > 0) bits.push(ru ? `🚚 Бесплатная доставка от ${rub(i.freeFrom)}` : `🚚 Free delivery from ${rub(i.freeFrom)}`);
  if (i && i.pickup) bits.push(ru ? '🏠 Есть самовывоз' : '🏠 Pickup available');
  bits.push(ru ? '💳 Оплата картой или СБП' : '💳 Card or SBP payment');
  $('infostrip').innerHTML = `<div class="info-strip">${bits.map(b => `<span>${b}</span>`).join('')}</div>`;
}
function renderChips() {
  const cats = [...new Map(products.filter(p => p.category && !p.is_addon).map(p => [p.category, ct(p)])).entries()];
  $('chips').innerHTML = [`<button class="chip ${cat === null ? 'on' : ''}" data-c="">${L.all}</button>`]
    .concat(cats.map(([k, v]) => `<button class="chip ${cat === k ? 'on' : ''}" data-c="${esc(k)}">${esc(v)}</button>`)).join('');
}
function renderGrid() {
  const q = query.trim().toLowerCase();
  const list = products.filter(p => !p.is_addon && (!onlyStock || p.stock > 0) && (!cat || p.category === cat) &&
    (!q || [p.name, p.name_en, p.description, p.category, p.category_en].join(' ').toLowerCase().includes(q)));
  const eff = p => (p.group_key ? Math.min(...siblings(p).map(x => x.price * (isW(x) ? 100 : 1))) : p.price * (isW(p) ? 100 : 1));
  if (sortBy === 'asc') list.sort((a, b) => eff(a) - eff(b));
  else if (sortBy === 'desc') list.sort((a, b) => eff(b) - eff(a));
  // варианты одного товара — одна карточка (берём первый в наличии)
  const seen = new Set();
  const uniq = list.filter(p => { if (!p.group_key) return true; if (seen.has(p.group_key)) return false; seen.add(p.group_key); return true; });
  $('grid').innerHTML = uniq.length ? uniq.map(cardHtml).join('') : `<div class="empty"><b>🔍</b>${L.empty}</div>`;
}

/* ---------- корзина ---------- */
function cartTotals() {
  let n = 0, sum = 0;
  for (const [id, q] of Object.entries(cart)) { const p = byId(id); if (p) { n += isW(p) ? 1 : q; sum += q * p.price; } }
  return { n, sum };
}
function renderCart() {
  const { n, sum } = cartTotals();
  $('cartCount').textContent = n || '';
  const ru = lang !== 'en';
  const lines = Object.entries(cart).map(([id, q]) => ({ p: byId(id), q })).filter(x => x.p);
  const free = shopInfo && shopInfo.freeFrom > 0 ? shopInfo.freeFrom : 0;
  const prog = free && lines.length ? (sum >= free
    ? `<div class="freebar ok"><b>${ru ? '🎉' : ''}</b> ${ru ? 'Доставка будет бесплатной' : 'Delivery will be free'}</div>`
    : `<div class="freebar"><div>${ru ? `Добавьте ещё на <b>${rub(free - sum)}</b> — и доставка бесплатно` : `Add <b>${rub(free - sum)}</b> more for free delivery`}</div><div class="bar"><i style="width:${Math.min(100, Math.round(sum / free * 100))}%"></i></div></div>`) : '';
  $('v-cart').innerHTML = `<div class="carthead"><h1>${L.cartTitle}</h1>${lines.length ? `<button class="linkbtn" data-clear>${ru ? 'Очистить' : 'Clear'}</button>` : ''}</div>` + (lines.length ? prog + lines.map(({ p, q }) => `
      <div class="line">
        <div class="thumb" data-open="${p.id}">${photo(p)}</div>
        <div class="mid"><div class="name">${esc(nm(p))}</div>
          <div class="sub">${isW(p) ? gram(q, p.unit) + ' · ' + priceText(p) : (q > 1 ? q + ' × ' + rub(p.price) : '')}</div>
          <div class="price">${rub(p.price * q)}</div></div>
        <div class="rt"><div class="step"><button data-dec="${p.id}" aria-label="−">−</button><span>${qtyText(p, q)}</span><button data-add="${p.id}" aria-label="+">+</button></div>
          <button class="linkbtn rm" data-rm="${p.id}">${ru ? 'Убрать' : 'Remove'}</button></div>
      </div>`).join('') + `
      <div class="total"><span>${L.total}</span><b>${rub(sum)}</b></div>
      <div class="note" style="text-align:left;margin:-6px 0 12px">${ru ? 'Способ получения и стоимость доставки выберете на следующем шаге.' : 'You will choose delivery on the next step.'}</div>
      ${inTg ? '' : `<button class="btn" data-checkout>${L.checkout(rub(sum))}</button>`}
      <div class="note">${L.checkoutNote}</div>`
    : `<div class="empty"><b>🛒</b>${L.cartEmpty}<br><span style="font-size:13px">${ru ? 'Загляните в каталог — мы подскажем, что выбрать' : 'Browse the catalog to get started'}</span><br><br><button class="btn" data-tab="catalog">${L.toCatalog}</button></div>`);
  const bar = $('cartbar');
  bar.innerHTML = !inTg && n > 0 && tab === 'catalog' ? `<button data-tab="cart"><span>🛒 ${n} · ${rub(sum)}</span><b>${ru ? 'В корзину →' : 'Go to cart →'}</b></button>` : '';
  mainButton();
}
function mainButton() {
  if (!inTg || !tg.MainButton) return;
  const { n, sum } = cartTotals();
  // в корзине — «Оформить», на других вкладках при непустой корзине — «Корзина · сумма»
  if (n > 0 && tab !== 'orders' && tab !== 'admin') {
    const text = tab === 'checkout' ? (typeof coCost === 'function' && coCost() == null ? tt('Рассчитать и оформить', 'Calculate and place order') : tt('Оплатить · ', 'Pay · ') + rub(coTotal())) : tab === 'cart' ? L.checkout(rub(sum)) : `🛒 ${L.tCart} · ${rub(sum)}`;
    tg.MainButton.setParams({ text, color: '#e8590c', text_color: '#ffffff' });
    tg.MainButton.show();
  } else tg.MainButton.hide();
}
function refresh(id) {
  document.querySelectorAll(`[data-ctrl="${id}"]`).forEach(el => { el.innerHTML = ctrl(byId(id)); });
  if (openId == id) renderSheet();
  renderCart();
}
async function change(id, delta) {
  const p = byId(id); if (!p) return;
  const cur = cart[id] || 0;
  let q;
  if (isW(p)) q = delta > 0 ? (cur ? cur + stepOf(p) : minOf(p)) : (cur - stepOf(p) < minOf(p) ? 0 : cur - stepOf(p));
  else q = Math.max(0, cur + delta);
  if (q > p.stock) { toast(L.noMore); return; }
  const prev = cart[id] || 0;
  if (q) cart[id] = q; else delete cart[id];
  haptic(delta > 0 ? 'medium' : 'light');
  refresh(id);
  try { await api('/cart', { product_id: id, qty: q }); }
  catch (e) { if (prev) cart[id] = prev; else delete cart[id]; refresh(id); toast(e.message); }
}
async function setQty(id, q) {
  const p = byId(id); if (!p) return;
  if (q > p.stock) { toast(L.noMore); return; }
  const prev = cart[id] || 0;
  if (q) cart[id] = q; else delete cart[id];
  haptic('medium'); refresh(id);
  try { await api('/cart', { product_id: id, qty: q }); }
  catch (e) { if (prev) cart[id] = prev; else delete cart[id]; refresh(id); toast(e.message); }
}
async function checkout() {
  if (!cartTotals().n) { toast(L.cartEmpty); return; }
  try {
    tg?.MainButton?.showProgress?.();
    await api('/checkout', {});
    if (inTg) tg.close(); else toast('✓');
  } catch (e) { toast(e.message); } finally { tg?.MainButton?.hideProgress?.(); }
}

/* ---------- заказы ---------- */
const ordDisc = o => Math.max(0, o.items.reduce((a, i) => a + i.price * i.qty, 0) + (o.delivery_cost || 0) - o.total);
function statusHelp(o) {
  const ru = lang !== 'en', pick = o.pickup;
  const m = {
    awaiting_payment: ru ? 'Ждём оплату. Нажмите «Оплатить» ниже — ссылка действует недолго.' : 'Waiting for payment. Tap Pay below — the link is valid for a short time.',
    paid: ru ? 'Оплата получена. Скоро начнём собирать заказ.' : 'Payment received. We will start packing soon.',
    assembling: ru ? 'Собираем ваш заказ.' : 'We are packing your order.',
    shipped: pick ? (ru ? 'Заказ готов к выдаче — приходите, мы ждём.' : 'Ready for pickup.') : (ru ? 'Заказ отправлен. Трек-номер появится ниже, если он есть.' : 'Your order is on its way.'),
    delivered: pick ? (ru ? 'Заказ выдан. Спасибо, что выбрали нас!' : 'Picked up. Thank you!') : (ru ? 'Заказ доставлен. Приятного!' : 'Delivered. Enjoy!'),
    cancelled: ru ? 'Заказ отменён. Если оплата была — деньги вернутся.' : 'Order cancelled. If paid, you will be refunded.',
  };

}
async function loadOrders() {
  $('v-orders').innerHTML = `<h1>${L.ordersTitle}</h1><div class="skel" style="aspect-ratio:3/1"></div>`;
  let subsData = { subscriptions: [], intervals: [] };
  try { orders = (await api('/orders')).orders; } catch (e) { $('v-orders').innerHTML = `<h1>${L.ordersTitle}</h1><div class="empty">${esc(e.message)}</div>`; return; }
  try { subsData = await api('/subscriptions'); } catch { /* подписки не обязательны для показа заказов */ }
  const dayName = n => lang === 'en' ? (n === 7 ? 'every week' : n === 14 ? 'every 2 weeks' : n === 21 ? 'every 3 weeks' : n === 30 ? 'every month' : n === 60 ? 'every 2 months' : `every ${n} days`) : (n === 7 ? 'раз в неделю' : n === 14 ? 'раз в 2 недели' : n === 21 ? 'раз в 3 недели' : n === 30 ? 'раз в месяц' : n === 60 ? 'раз в 2 месяца' : `раз в ${n} дн.`);
  const STL = { awaiting_payment: 'Awaiting payment', paid: 'Paid', assembling: 'Packing', shipped: 'Shipped', delivered: 'Delivered', cancelled: 'Cancelled' };
  const subsHtml = subsData.subscriptions.length ? `<div class="box"><h3>${tt('Регулярные заказы', 'Recurring orders')}</h3>${subsData.subscriptions.map(x => `
      <div class="sub" style="padding:8px 0;border-top:1px solid var(--line,#eee)">
        <div><b>${dayName(x.interval_days)}</b>${x.active ? ` · ${tt('следующий', 'next')} ${esc(x.next_date.split('-').reverse().join('.'))}` : tt(' · на паузе', ' · paused')}</div>
        <div class="note" style="text-align:left">${x.items.map(i => esc(i.name) + (i.unit ? ', ' + gram(i.qty, i.unit) : ' × ' + i.qty)).join(', ')}</div>
        <div class="seg" style="margin-top:6px;flex-wrap:wrap">
          ${x.active ? `<button data-subact="skip" data-sub="${x.id}">${tt('Пропустить раз', 'Skip once')}</button><button data-subact="pause" data-sub="${x.id}">${tt('Пауза', 'Pause')}</button>` : `<button data-subact="resume" data-sub="${x.id}">${tt('Возобновить', 'Resume')}</button>`}
          <button data-subact="delete" data-sub="${x.id}">${tt('Отменить', 'Cancel')}</button>
        </div>
      </div>`).join('')}
      <div class="note" style="text-align:left">${tt('Деньги не списываются сами: в нужный день пришлём ссылку на оплату.', 'Nothing is charged automatically: on the due day we will send you a payment link.')}</div></div>` : '';
  window.__subIntervals = subsData.intervals;
  $('v-orders').innerHTML = `<h1>${L.ordersTitle}</h1>` + subsHtml + (orders.length ? orders.map(o => `
    <div class="order">
      <div class="top"><span class="code">№ ${esc(o.code)}</span><span class="pill ${esc(o.status)}">${esc(lang === 'en' ? (o.pickup && o.status === 'shipped' ? 'Ready for pickup' : STL[o.status] || o.statusLabel) : o.statusLabel)}</span></div>
      <div class="stnote">${esc(statusHelp(o))}</div>
      ${o.step >= 0 ? `<div class="steps">${(lang === 'en' ? ['Paid', 'Packing', o.pickup ? 'Ready' : 'Shipped', o.pickup ? 'Picked up' : 'Delivered'] : ['Оплачен', 'Собираем', o.pickup ? 'Готов' : 'Отправлен', o.pickup ? 'Получен' : 'Доставлен'])
        .map((n, i) => `<div class="${i < o.step || o.step === 3 ? 'done' : i === o.step ? 'now' : ''}">${n}</div>`).join('')}</div>` : ''}
      <ul>${o.items.map(i => `<li><span>${esc(byId(i.id) ? nm(byId(i.id)) : i.name)}${i.unit ? ', ' + gram(i.qty, i.unit) : ' × ' + i.qty}</span><span>${rub(i.price * i.qty)}</span></li>`).join('')}
        ${o.delivery_cost ? `<li><span>${L.delivery}</span><span>${rub(o.delivery_cost)}</span></li>` : ''}
        ${ordDisc(o) ? `<li><span>${tt('Скидка', 'Discount')}</span><span>−${rub(ordDisc(o))}</span></li>` : ''}</ul>
      <div class="sum"><span>${L.total}</span><span>${rub(o.total)}</span></div>
      <div class="meta">${esc(when(o.created_at))}${o.address ? ' · ' + esc((lang === 'en' && o.address_en) || o.address) : ''}</div>
      ${o.track ? `<div class="track">🚚 ${lang === 'en' ? 'Tracking' : 'Трек-номер'}: <b>${esc(o.track)}</b></div>` : ''}
      ${o.rating ? `<div class="stars">${'★'.repeat(o.rating)}${'☆'.repeat(5 - o.rating)}</div>` : ''}
      ${o.can_pay ? `<button class="btn pay" data-payorder="${o.id}">💳 ${tt('Оплатить', 'Pay')} ${rub(o.total)}</button>` : ''}
      ${o.status !== 'awaiting_payment' && o.status !== 'cancelled' ? `<div class="seg" style="margin-top:8px;flex-wrap:wrap"><button data-repeat="${o.id}">${tt('Повторить заказ', 'Order again')}</button>${o.can_subscribe ? `<button data-subnew="${o.id}">${tt('Повторять регулярно', 'Repeat regularly')}</button>` : ''}</div>` : ''}

}

/* ---------- AI-подбор ---------- */
async function aiAsk() {
  const query = $('aiQ').value.trim(); if (!query) { $('aiQ').focus(); return; }
  $('aiGo').disabled = true; $('aiGo').innerHTML = `<span class="dots">${L.aiWait}</span>`;
  $('aiAdvice').textContent = ''; $('aiGrid').innerHTML = '';
  try {
    const d = await api('/ai', { query }, 1);
    $('aiAdvice').textContent = d.advice || '';
    const seenG = new Set(), list = (d.ids || []).map(byId).filter(Boolean).filter(p => { if (!p.group_key) return true; if (seenG.has(p.group_key)) return false; seenG.add(p.group_key); return true; });
    $('aiGrid').innerHTML = list.length ? list.map(cardHtml).join('') : `<div class="empty">${L.aiNone}</div>`;
  } catch (e) { toast(e.message); }
  finally { $('aiGo').disabled = false; $('aiGo').textContent = L.aiGo; }
}

/* ---------- карточка товара ---------- */
let openId = null;
function renderSheet() {
  const p = byId(openId); if (!p) return;
  const stock = p.stock > 0 ? `<div class="stock" style="color:var(--ok)">✓ ${isW(p) ? (lang === 'en' ? 'In stock: ' : 'В наличии: ') + gram(p.stock, p.unit) : L.inStock(p.stock)}</div>` : `<div class="stock" style="color:var(--bad)">${L.out}</div>`;
  const q = cart[p.id] || 0;
  const act = p.stock < minOf(p) ? '' : q
    ? `<div class="step"><button data-dec="${p.id}">−</button><span>${qtyText(p, q)}</span><button data-add="${p.id}">+</button></div>`
    : `<button class="add" data-add="${p.id}">${L.addBtn}</button>`;
  const sib = siblings(p);
  // один или два ряда выбора: первый параметр (вес) и второй (упаковка/цвет); при смене подбираем товар с таким же вторым значением
  const has2 = sib.some(x => x.option2_label);
  const uniq1 = [...new Map(sib.map(x => [x.option_label, x])).values()];
  const uniq2 = [...new Map(sib.filter(x => x.option2_label).map(x => [x.option2_label, x])).values()];
  const pick = (o1, o2) => sib.find(x => x.option_label === o1 && (x.option2_label || '') === (o2 || '')) || null;
  const chip = (label, on, target, off) => `<button class="chip ${on ? 'on' : ''} ${off ? 'off' : ''}" data-variant="${target.id}">${esc(label)}</button>`;
  const opts = sib.length <= 1 ? '' : has2
    ? `<div class="opts">${uniq1.map(x => { const t = pick(x.option_label, p.option2_label) || sib.find(y => y.option_label === x.option_label); return chip(optOf(x), x.option_label === p.option_label, t, t.stock <= 0); }).join('')}</div>
       <div class="opts">${uniq2.map(x => { const t = pick(p.option_label, x.option2_label) || sib.find(y => y.option2_label === x.option2_label); return chip(opt2Of(x), x.option2_label === p.option2_label, t, t.stock <= 0); }).join('')}</div>`
    : `<div class="opts">${sib.map(x => chip(optOf(x), x.id === p.id, x, x.stock <= 0)).join('')}</div>`;
  const adds = addonsFor(p);
  const addHtml = adds.length ? `<div class="addons"><h3>${lang === 'en' ? 'Add to your order' : 'Добавить к заказу'}</h3>${adds.map(a => `
      <div class="arow"><div><div class="an">${esc(nm(a))}</div><div class="ap">+ ${priceText(a)}</div></div><div data-ctrl="${a.id}">${ctrl(a)}</div></div>`).join('')}</div>` : '';
  const bundleHtml = p.bundle && p.bundle.length ? `<div class="bset"><div class="btitle">${lang === 'en' ? 'What is inside' : 'Что в наборе'}</div>
      ${p.bundle.map(b => `<div class="bline"><span class="bn">${esc(bName(b))}</span><span class="bq">${b.unit ? gram(b.qty, b.unit) : '× ' + b.qty}</span><span class="bp">${rub((b.price || 0) * b.qty)}</span></div>`).join('')}
      ${bundleSave(p) ? `<div class="bsave"><span>${lang === 'en' ? 'Separately' : 'Отдельно'}: <s>${rub(bundleSum(p))}</s></span><b>${lang === 'en' ? 'You save' : 'Выгода'} ${rub(bundleSave(p))}</b></div>` : ''}</div>` : '';
  const presets = isW(p) ? [...new Set([minOf(p), 250, 500, 750, 1000, 2000].filter(v => v >= minOf(p) && v % stepOf(p) === 0 && v <= p.stock))].sort((a, b) => a - b).slice(0, 5) : [];
  const weightHint = isW(p) ? `<div class="wbox"><div class="wlbl">${lang === 'en' ? 'How much do you need?' : 'Сколько нужно?'}</div>
      <div class="opts">${presets.map(v => `<button class="chip ${q === v ? 'on' : ''}" data-setq="${p.id}:${v}">${gram(v, p.unit)}</button>`).join('')}</div>
      <div class="note" style="text-align:left;margin:2px 0 0">${lang === 'en' ? `Or use − / + : from ${gram(minOf(p), p.unit)}, step ${gram(stepOf(p), p.unit)}` : `Или кнопками − / + : от ${gram(minOf(p), p.unit)}, шаг ${gram(stepOf(p), p.unit)}`}${q ? ` · ${lang === 'en' ? 'Total' : 'Сумма'}: <b>${rub(p.price * q)}</b>` : ''}</div></div>` : '';
  $('sheet').innerHTML = `<button class="x" data-close>✕</button>
    <div class="big">${photo(p)}</div>
    <div class="body">
      ${ct(p) ? `<div class="cat">${esc(ct(p))}</div>` : ''}
      <h2>${esc(baseOf(p))}</h2>
      ${opts}
      ${ds(p) ? `<p>${esc(ds(p))}</p>` : ''}
      ${bundleHtml}
      ${stock}
      ${weightHint}
      <div class="act"><div class="price">${priceText(p)}</div>${act}</div>
      ${q ? `<button class="btn ghost" data-gocart style="margin-top:10px">${lang === 'en' ? 'Go to cart' : 'Перейти в корзину'} · ${rub(cartTotals().sum)}</button>` : ''}
      ${addHtml}
    </div>`;
}
function openSheet(id) { openId = id; renderSheet(); document.body.classList.add('open'); tg?.BackButton?.show(); }
function closeSheet() { openId = null; document.body.classList.remove('open'); if (tab === 'catalog') tg?.BackButton?.hide(); }

/* ---------- вкладки ---------- */
function go(t) {
  tab = t;
  if (typeof renderCart === 'function' && products.length) renderCart();
  document.querySelectorAll('section.view').forEach(s => s.classList.toggle('on', s.id === 'v-' + t));
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === (t === 'checkout' ? 'cart' : t)));
  if (t === 'orders') loadOrders();
  if (t === 'admin') loadAdmin();
  if (t === 'cart') renderCart();
  if (t === 'catalog') tg?.BackButton?.hide(); else tg?.BackButton?.show();
  mainButton();
  scrollTo(0, 0);
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-add],[data-dec],[data-setq],[data-rm],[data-clear],[data-stockonly],[data-gocart],[data-open],[data-variant],[data-close],[data-c],[data-tab],[data-lang],[data-hint],[data-checkout],[data-retry]');
  if (!t) return;
  const d = t.dataset;
  if (d.stockonly !== undefined) { onlyStock = !onlyStock; renderTools(); renderGrid(); }
  else if (d.rm) { e.stopPropagation(); setQty(+d.rm, 0); }
  else if (d.clear !== undefined) { ask(lang === 'en' ? 'Clear the cart?' : 'Очистить корзину?').then(ok => { if (ok) Object.keys(cart).forEach(id => setQty(+id, 0)); }); }
  else if (d.gocart !== undefined) { closeSheet(); go('cart'); }
  else if (d.setq) { e.stopPropagation(); const [id, v] = d.setq.split(':').map(Number); setQty(id, cart[id] === v ? 0 : v); }
  else if (d.add) { e.stopPropagation(); change(+d.add, 1); }
  else if (d.dec) { e.stopPropagation(); change(+d.dec, -1); }
  else if (d.c !== undefined) { cat = d.c || null; renderChips(); renderGrid(); }
  else if (d.close !== undefined) closeSheet();
  else if (d.variant) { openId = +d.variant; renderSheet(); }
  else if (d.open) openSheet(+d.open);

/* — заказы — */
function nextStep(o) {
  if (o.status === 'awaiting_payment' || o.status === 'pending') return ['paid', '✅ Оплачен (вручную)'];
  if (o.status === 'paid') return ['assembling', '📦 Начать сборку'];
  if (o.status === 'assembling') return ['shipped', o.pickup ? '🏠 Готов к выдаче' : '🚚 Отправить'];
  if (o.status === 'shipped') return ['delivered', o.pickup ? '✅ Выдан' : '✅ Доставлен'];
  if (o.status === 'cancelled') return ['paid', o.was_paid ? '↩️ Вернуть в работу' : '✅ Оплачен (вручную)'];
  return null;
}
function orderCard(o) {
  const ns = nextStep(o);
  const extra = [
    o.promo ? `🎟 ${esc(o.promo)} −${o.discount}%` : '',
    o.track ? `🚚 Трек: <b>${esc(o.track)}</b>` : '',
    o.rating ? `${'★'.repeat(o.rating)}${'☆'.repeat(5 - o.rating)}` : '',
  ].filter(Boolean).join(' · ');
  return `
    <div class="order" id="ord-${o.id}">
      <div class="top"><span class="code">№ ${esc(o.code)}${o.buyer ? ' · ' + esc(o.buyer) : ''}</span><span class="pill ${esc(o.status)}">${esc(stLabel(o))}</span></div>
      <ul>${o.items.map(i => `<li><span>${esc(i.name)}${i.unit ? ', ' + gram(i.qty, i.unit) : ' × ' + i.qty}</span><span>${rub(i.price * i.qty)}</span></li>`).join('')}
        ${o.pickup ? '' : `<li><span>Доставка</span><span>${o.delivery_cost ? rub(o.delivery_cost) : 'бесплатно'}</span></li>`}
        ${ordDisc(o) ? `<li><span>Скидка${o.discount ? ' ' + o.discount + '%' : ''}</span><span>−${rub(ordDisc(o))}</span></li>` : ''}</ul>
      <div class="sum"><span>Итого</span><span>${rub(o.total)}</span></div>
      <div class="meta">${esc(when(o.created_at))} · ${o.pickup ? '🏠 Самовывоз' : '📍 ' + esc(o.address)}</div>
      ${extra ? `<div class="meta">${extra}</div>` : ''}
      <div class="contact">${o.phone ? `<a class="mini" href="tel:${esc(o.phone.replace(/[^\d+]/g, ''))}">📞 ${esc(o.phone)}</a>` : ''}<button class="mini" data-chatwith="${o.chat_id}">💬 Написать</button></div>
      <div class="oact">${ns ? `<button class="btn" data-ost="${o.id}:${ns[0]}">${ns[1]}</button>` : ''}
        ${!['cancelled', 'delivered'].includes(o.status) ? `<button class="btn ghost small" data-ost="${o.id}:cancelled">Отменить</button>` : ''}
        ${o.status === 'shipped' && !o.pickup ? `<button class="btn ghost small" data-track="${o.id}">Трек</button>` : ''}</div>
    </div>`;
}

/* ---------- оформление и оплата ---------- */
let co = { delivery: 'city', city: '', other: '', address: '', phone: '', email: '', carrier: '', quote: null, promo: '', promoPct: 0, promoOk: false }, coInfo = null;
const coGoods = () => { const { sum } = cartTotals(); return sum - (co.promoPct ? Math.round(sum * co.promoPct / 100) : 0); };
const coFree = () => Boolean(coInfo && coInfo.freeFrom > 0 && co.delivery !== 'pickup' && coGoods() >= coInfo.freeFrom);
const coKey = () => [co.city, co.other, co.address].join('|').trim().toLowerCase();
const coCityName = () => co.delivery === 'city' && co.city !== '__other' ? co.city : (co.delivery === 'city' ? co.other.trim() : co.city.trim());
// null — цена пока неизвестна (нужен расчёт по адресу)
const coCost = () => {
  if (co.delivery === 'pickup' || !coInfo) return 0;
  if (coFree()) return 0;
  if (co.delivery === 'post') { const c = (coInfo.post?.carriers || []).find(x => x.id === co.carrier); return c ? c.price : 0; }
  if (co.delivery === 'distance') return co.quote && co.quote.key === coKey() ? co.quote.delivery : null;
  const n = s => String(s || '').trim().toLowerCase().replace(/ё/g, 'е').replace(/\s+/g, ' ');
  const want = co.city === '__other' ? n(co.other) : n(co.city);
  const c = coInfo.cities.find(x => n(x.city) === want || (x.city_en && n(x.city_en) === want));
  return c ? c.price : (co.city === '__other' ? coInfo.otherPrice : 0);
};
async function openCheckout() {
  if (!cartTotals().n) { toast(L.cartEmpty); return; }
  go('checkout');
  if (!coInfo) $('v-checkout').innerHTML = `<h1>${tt('Оформление', 'Checkout')}</h1><div class="skel" style="aspect-ratio:3/1"></div>`;
  /* условия доставки владелец может менять — берём свежие при каждом открытии */
  try { shopInfo = await api('/checkout-info'); } catch (e) { $('v-checkout').innerHTML = `<h1>${tt('Оформление', 'Checkout')}</h1><div class="empty">${esc(e.message)}<br><br><button class="btn ghost" data-checkout>${tt('Повторить', 'Retry')}</button></div>`; return; }
  coInfo = shopInfo;
  if (co.city !== '__other' && !coInfo.cities.some(c => c.city === co.city)) co.city = coInfo.cities.length ? (coInfo.cities.find(c => /петербург/i.test(c.city)) || coInfo.cities[0]).city : '__other';
  if (!coInfo.pickup && co.delivery === 'pickup') co.delivery = 'city';
  if (co.delivery === 'post' && !coInfo.post) co.delivery = 'city';
  if (co.delivery === 'distance' && !coInfo.distance) co.delivery = 'city';
  if (!coInfo.post) co.carrier = ''; else if (!coInfo.post.carriers.some(c => c.id === co.carrier)) co.carrier = coInfo.post.carriers[0]?.id || '';
  if (!coReady) {
    const saved = String(coInfo.contact || '').split(/\s+/);
    if (!co.phone) co.phone = saved.find(x => !x.includes('@') && x.replace(/\D/g, '').length >= 10) || '';
    if (!co.email) co.email = saved.find(x => x.includes('@')) || '';
    coReady = true;
  }
  if (co.promoPct) { try { const d = await api('/promo', { code: co.promo }, 1); co.promoPct = d.percent; } catch (e) { co.promoPct = 0; co.promoOk = false; } }
  co.err = {};
  renderCheckout();
}

  else if (co.delivery === 'city') body = fld('coCity', tt('Город', 'City'), `<select id="coCity">${coInfo.cities.map(c => `<option value="${esc(c.city)}" ${co.city === c.city ? 'selected' : ''}>${esc(cityName(c))} — ${rub(c.price)}</option>`).join('')}
          <option value="__other" ${co.city === '__other' ? 'selected' : ''}>${tt('Другой город', 'Other city')} — ${rub(coInfo.otherPrice)}</option></select>`)
    + (co.city === '__other' ? fld('coOther', tt('Название города', 'City name'), `<input id="coOther" class="${bad('coOther')}" placeholder="${tt('Например, Тверь', 'E.g. Tver')}" value="${esc(co.other)}">`) : '') + addr();
  else if (co.delivery === 'post') body = fld('coCarrier', tt('Перевозчик', 'Carrier'), `<select id="coCarrier">${coInfo.post.carriers.map(c => `<option value="${esc(c.id)}" ${co.carrier === c.id ? 'selected' : ''}>${esc(c.name)} — ${rub(c.price)}</option>`).join('')}</select>`)
    + fld('coOther', tt('Город', 'City'), `<input id="coOther" class="${bad('coOther')}" placeholder="${tt('Город получателя', 'Recipient city')}" value="${esc(co.other)}">`) + addr(tt('Улица, дом, квартира — или пункт выдачи и индекс', 'Street, house, flat — or a pickup point and postcode'))
    + `<div class="note" style="text-align:left">${tt('Отправим выбранным перевозчиком и пришлём трек-номер в этот чат.', 'We will ship with the chosen carrier and send the tracking number to this chat.')}</div>`;
  else body = fld('coOther', tt('Город', 'City'), `<input id="coOther" class="${bad('coOther')}" placeholder="${tt('Ваш город', 'Your city')}" value="${esc(co.other)}">`) + addr()
    + `<button class="btn ghost" data-quote style="margin-top:8px">${tt('Рассчитать стоимость', 'Calculate the cost')}</button>
       <div class="note" style="text-align:left">${co.quote && co.quote.key === coKey() ? tt(`✓ Расстояние ≈ ${co.quote.km} км — доставка ${rub(co.quote.delivery)}`, `✓ Distance ≈ ${co.quote.km} km — delivery ${rub(co.quote.delivery)}`) : tt(`Возим до ${coInfo.distance.maxKm} км. Стоимость зависит от расстояния до вашего адреса.`, `We deliver up to ${coInfo.distance.maxKm} km. The price depends on the distance to your address.`)}</div>`;
  $('v-checkout').innerHTML = `<h1>${tt('Оформление', 'Checkout')}</h1>
    <div class="steps2"><b>${tt('① Получение', '① Delivery')}</b><span>${tt('② Оплата', '② Payment')}</span><span>${tt('③ Статус в чате', '③ Status in chat')}</span></div>
    <div class="box"><h3>${tt('Ваш заказ', 'Your order')}</h3>
      <ul class="osum">${lines.map(({ p, q }) => `<li><span>${esc(nm(p))}${isW(p) ? ', ' + gram(q, p.unit) : q > 1 ? ' × ' + q : ''}</span><span>${rub(p.price * q)}</span></li>`).join('')}</ul></div>
    <div class="box"><h3>${tt('Как получить', 'How to receive')}</h3>
      ${tiles.map(([k, ic, t, sub]) => `<button class="tile ${co.delivery === k ? 'on' : ''}" data-dl="${k}"><i>${ic}</i><span><div class="tt">${t}</div><div class="ts">${sub}</div></span><span class="dot"></span></button>`).join('')}
      ${co.delivery !== 'pickup' && coInfo.freeFrom > 0 ? `<div class="note" style="text-align:left;margin:0 0 4px">${coFree() ? tt('✓ Доставка для вас бесплатная', '✓ Delivery is free for you') : tt(`Бесплатная доставка от ${rub(coInfo.freeFrom)} — осталось ${rub(coInfo.freeFrom - coGoods())}`, `Free delivery from ${rub(coInfo.freeFrom)} — ${rub(coInfo.freeFrom - coGoods())} to go`)}</div>` : ''}
      ${body}</div>
    <div class="box"><h3>${tt('Контакты', 'Contacts')}</h3>
      ${fld('coPhone', tt('Телефон', 'Phone'), `<input id="coPhone" class="${bad('coPhone')}" type="tel" inputmode="tel" autocomplete="tel" placeholder="+7 900 000-00-00" value="${esc(co.phone)}">`, tt('чтобы связаться по заказу', 'so we can reach you about the order'))}
      ${coInfo.receipts ? fld('coEmail', 'E-mail', `<input id="coEmail" class="${bad('coEmail')}" type="email" inputmode="email" autocomplete="email" placeholder="name@mail.ru" value="${esc(co.email)}">`, tt('необязательно — для чека', 'optional — for the receipt')) + `<div class="note" style="text-align:left">${tt('Чек придёт после оплаты на телефон или e-mail.', 'The receipt will be sent after payment to your phone or e-mail.')}</div>` : ''}
    </div>
    <div class="box"><h3>${tt('Промокод', 'Promo code')}</h3>
      <div class="promo"><input id="coPromo" placeholder="${tt('Если есть', 'If you have one')}" value="${esc(co.promo)}" autocapitalize="characters"><button class="btn ghost" data-promo>${tt('Применить', 'Apply')}</button></div>
      ${co.promoOk && co.promoPct ? `<div class="fld ok">✓ ${tt(`Скидка ${co.promoPct}%`, `Discount ${co.promoPct}%`)}</div>` : ''}
    </div>
    <div class="box">
      <div class="sumrow"><span>${tt('Товары', 'Items')}</span><span>${rub(sum)}</span></div>
      ${disc ? `<div class="sumrow"><span>${tt(`Скидка ${co.promoPct}%`, `Discount ${co.promoPct}%`)}</span><span>−${rub(disc)}</span></div>` : ''}
      <div class="sumrow"><span>${L.delivery}</span><span>${co.delivery === 'pickup' || coFree() ? tt('бесплатно', 'free') : dcost == null ? tt('посчитаем по адресу', 'calculated by address') : rub(dcost)}</span></div>
      <div class="sumrow big"><span>${tt('К оплате', 'To pay')}</span><span>${dcost == null ? '—' : rub(total)}</span></div>
    </div>
    ${inTg ? '' : `<button class="btn" data-pay>${dcost == null ? tt('Рассчитать и оформить', 'Calculate and place order') : tt('Оплатить · ', 'Pay · ') + rub(total)}</button>`}
    <div class="note">${L.checkoutNote} ${tt('Деньги списываются только после вашего подтверждения оплаты.', 'You are charged only after you confirm the payment.')}</div>`;
  const clr = el => { el.classList.remove('bad'); el.closest('.fld')?.querySelector('.ferr')?.remove(); if (co.err) delete co.err[el.id]; };
  const bind = (id, k, rerender) => { const el = $(id); if (el) el[el.tagName === 'SELECT' ? 'onchange' : 'oninput'] = e => { co[k] = e.target.value; clr(el); if (rerender) renderCheckout(); else mainButton(); }; };
  bind('coCity', 'city', true); bind('coCarrier', 'carrier', true); bind('coOther', 'other'); if ($('coOther') && co.delivery === 'city') $('coOther').onchange = () => renderCheckout();
  bind('coAddr', 'address'); bind('coPhone', 'phone'); bind('coEmail', 'email'); bind('coPromo', 'promo');
  if ($('coAddr') && co.delivery === 'distance') $('coAddr').onchange = () => renderCheckout();
  mainButton();
}
function coTotal() { return coGoods() + (coCost() || 0); }
async function quoteDistance() {
  if (co.other.trim().length < 2 || co.address.trim().length < 5) { toast(tt('Укажите город и адрес', 'Enter a city and an address')); return false; }
  try {
    const d = await api('/delivery-quote', { delivery: 'distance', city: co.other.trim(), address: co.address, promo: co.promoPct ? co.promo : '' }, 1);
    co.quote = { key: coKey(), delivery: d.delivery, km: d.km };
    renderCheckout(); return true;
  } catch (e) { toast(e.message); return false; }
}
async function applyPromo() {
  co.promo = ($('coPromo')?.value || '').trim();
  if (!co.promo) { co.promoPct = 0; co.promoOk = false; renderCheckout(); return; }
  try { const d = await api('/promo', { code: co.promo }, 1); co.promoPct = d.percent; co.promoOk = true; haptic('medium'); }
  catch (e) { co.promoPct = 0; co.promoOk = false; toast(e.message); }
  renderCheckout();
}
let paying = false;
async function pay() {
  if (paying) return;
  const m = co.delivery;
  if (m === 'city' && co.city === '__other' && co.other.trim().length < 2) return coFail('coOther', tt('Укажите город', 'Enter a city'));
  if ((m === 'post' || m === 'distance') && co.other.trim().length < 2) return coFail('coOther', tt('Укажите город', 'Enter a city'));
  if (m !== 'pickup' && co.address.trim().length < 5) return coFail('coAddr', tt('Укажите адрес: улица, дом, квартира', 'Enter an address: street, house, flat'));
  if (co.phone.replace(/\D/g, '').length < 10 && !(co.email && coInfo.receipts)) return coFail('coPhone', tt('Введите телефон полностью, например +7 900 123-45-67', 'Enter the full phone number, e.g. +7 900 123-45-67'));
  if (co.email && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(co.email.trim())) return coFail('coEmail', tt('Проверьте e-mail — например, name@mail.ru', 'Check the e-mail, e.g. name@mail.ru'));
  if (m === 'distance' && coCost() == null) { await quoteDistance(); return; } // сначала покажем цену, потом оплата
  if (co.promo && !co.promoPct) { await applyPromo(); if (!co.promoPct) return; }
  paying = true; tg?.MainButton?.showProgress?.();
  try {
    const city = m === 'city' ? (co.city === '__other' ? co.other.trim() : co.city) : m === 'pickup' ? '' : co.other.trim();
    const d = await api('/order', { delivery: m, city, carrier: m === 'post' ? co.carrier : '', address: co.address, phone: co.phone, email: co.email.trim(), promo: co.promoPct ? co.promo : '' }, 1);
    haptic('heavy');
    cart = {};
    try { products = (await api('/catalog')).products; renderChips(); } catch (e) {}
    renderCart(); renderGrid();
    co.promo = ''; co.promoPct = 0; co.promoOk = false; co.quote = null;
    if (tg?.openLink) tg.openLink(d.pay_url); else window.open(d.pay_url, '_blank');
    go('orders');
    toast(tt(`Заказ ${d.code} создан — осталось оплатить`, `Order ${d.code} created — now pay for it`));
  } catch (e) { toast(e.message); }
  finally { paying = false; tg?.MainButton?.hideProgress?.(); }
}
async function payOrder(id) {
  try { const d = await api(`/orders/${id}/pay`, {}, 1); if (tg?.openLink) tg.openLink(d.pay_url); else window.open(d.pay_url, '_blank'); }
  catch (e) { toast(e.message); }
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-dl],[data-promo],[data-pay],[data-payorder],[data-quote]');
  if (!t) return;
  const d = t.dataset;
  if (d.dl) { co.delivery = d.dl; renderCheckout(); }
  else if (d.promo !== undefined) applyPromo();
  else if (d.quote !== undefined) quoteDistance();
  else if (d.pay !== undefined) pay();
  else if (d.payorder) payOrder(+d.payorder);
});

document.addEventListener('click', async e => {
  const t = e.target.closest('[data-repeat],[data-subnew],[data-subact]');
  if (!t) return;
  const d = t.dataset;
  try {
    if (d.repeat) {
      const r = await api(`/orders/${d.repeat}/repeat`, {}, 1);
      cart = r.cart || {}; renderCart(); renderGrid(); go('cart');
      toast(r.missing ? tt('Часть товаров закончилась — добавили то, что есть', 'Some items ran out — we added what is available') : tt('Товары в корзине', 'Items added to the cart'));
    } else if (d.subnew) {
      const opts = window.__subIntervals || [14, 30];
      const days = await pickInterval(opts);
      if (!days) return;
      await api('/subscriptions', { order_id: +d.subnew, days }, 1);
      toast(tt('Регулярный заказ настроен', 'Recurring order set up')); loadOrders();
    } else if (d.subact) {
      if (d.subact === 'delete' && !(await ask(tt('Отменить регулярный заказ?', 'Cancel the recurring order?')))) return;
      await api(`/subscriptions/${d.sub}`, { action: d.subact }, 1);
      loadOrders();
    }
  } catch (err) { toast(err.message); }
});
function pickInterval(opts) {
  const name = n => lang === 'en' ? (n === 7 ? 'Every week' : n === 14 ? 'Every 2 weeks' : n === 21 ? 'Every 3 weeks' : n === 30 ? 'Every month' : n === 60 ? 'Every 2 months' : `Every ${n} days`) : (n === 7 ? 'Раз в неделю' : n === 14 ? 'Раз в 2 недели' : n === 21 ? 'Раз в 3 недели' : n === 30 ? 'Раз в месяц' : n === 60 ? 'Раз в 2 месяца' : `Раз в ${n} дн.`);
  return new Promise(res => {
    const w = document.createElement('div');
    w.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:99;display:flex;align-items:flex-end';
    w.id = 'intervalPick';
    w.innerHTML = `<div style="background:var(--card,#fff);color:var(--text,#222);width:100%;max-width:560px;margin:0 auto;padding:16px calc(16px + env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom));border-radius:16px 16px 0 0"><h3 style="margin:0 0 10px">${tt('Как часто повторять?', 'How often to repeat?')}</h3>
      ${opts.map(n => `<button class="btn ghost" data-n="${n}" style="width:100%;margin-bottom:8px">${name(n)}</button>`).join('')}
      <button class="btn ghost" data-n="0" style="width:100%">${tt('Закрыть', 'Close')}</button></div>`;
    w.onclick = ev => { const b = ev.target.closest('[data-n]'); if (b || ev.target === w) { w.remove(); res(b ? +b.dataset.n : 0); } };
    document.body.appendChild(w);
  });
}

let startTabDone = false;
async function load() {
  $('grid').innerHTML = '<div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div>';
  try {
    const d = await api('/catalog');
    lang = d.lang === 'en' ? 'en' : 'ru'; applyLang();
    products = d.products; cart = d.cart || {};
    isOwner = Boolean(d.isOwner);
    $('adminTab').hidden = !isOwner; $('tabs').classList.toggle('five', isOwner);
    if (isOwner) setUnread(d.unread);
    renderChips(); renderTools(); renderInfo(); renderGrid(); renderCart();
    api('/checkout-info').then(d => { shopInfo = d; renderInfo(); renderCart(); }).catch(() => {});
    const qs = new URLSearchParams(location.search), want = qs.get('tab');
    if (isOwner && want === 'admin' && ADM.some(a => a[0] === qs.get('adm'))) { admMode = qs.get('adm'); chatOpen = +qs.get('chat') || null; }
    if (!startTabDone && ['cart', 'orders', 'ai'].concat(isOwner ? ['admin'] : []).includes(want)) go(want);
    startTabDone = true;
  } catch (e) {
    $('grid').innerHTML = `<div class="empty"><b>😕</b>${esc(e.message)}${e.fatal ? '' : `<br><br><button class="btn ghost" data-retry>${L.retry}</button>`}</div>`;
  }
}
applyLang();
load().then(() => { if (isOwner && tab === 'catalog' && !new URLSearchParams(location.search).get('tab')) go('admin'); });
</script>
<script>
(() => {
  const sw = document.getElementById('roleSw'), D = window.__coffeeDemo; if (!sw || !D) return;
  const sync = () => sw.querySelectorAll('button').forEach(b => { const on = (b.dataset.role === 'owner') === D.isOwner(); b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
  sync();
  sw.addEventListener('click', async e => {
    const b = e.target.closest('button[data-role]'); if (!b) return;
    const own = b.dataset.role === 'owner'; if (own === D.isOwner()) return;
    D.setOwner(own); sync();
    try { closeSheet(); stopChatPoll(); } catch {}
    admMode = 'orders'; chatOpen = null;
    await load();
    go(own ? 'admin' : 'catalog');
  });
})();
</script>
<script>
// клавиатура на телефоне: помечаем body, пока активно поле ввода
(function(){var isT=matchMedia('(pointer:coarse)').matches;if(!isT)return;
document.addEventListener('focusin',function(e){var t=e.target;if(t.matches('input:not([type=checkbox]):not([type=radio]),textarea,select')){document.body.classList.add('kb');if(t.closest('.composer'))document.body.classList.add('kb-chat')}});
document.addEventListener('focusout',function(){setTimeout(function(){var a=document.activeElement;if(!a||!a.matches('input,textarea,select'))document.body.classList.remove('kb','kb-chat')},50)});})();
