<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MiniCRM</title>
<style>
:root{--bg:#f6f4f0;--card:#fff;--text:#1c1b19;--muted:#7a766e;--line:#e6e2da;--acc:#7a4a2b;--ok:#2f7d4f;--bad:#b3392b}
@media(prefers-color-scheme:dark){:root{--bg:#161513;--card:#201f1c;--text:#f0ede6;--muted:#9b968b;--line:#34322d;--acc:#d4a276;--ok:#6cc08b;--bad:#e8766a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;align-items:center;gap:6px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:5;flex-wrap:wrap}
header b{font-size:17px;margin-right:12px}.tab{border:0;background:none;color:var(--muted);padding:8px 12px;border-radius:8px;cursor:pointer;font:inherit}
.tab.on{background:var(--bg);color:var(--text)}.sp{flex:1}
main{padding:16px;max-width:1400px;margin:auto}
.board{display:grid;grid-template-columns:repeat(6,minmax(210px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--bg);border:1px dashed var(--line);border-radius:12px;padding:8px;min-height:140px}
.col.over{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 8%,var(--bg))}
.col h3{margin:4px 6px 8px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
.deal{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;cursor:grab}
.deal .t{display:flex;justify-content:space-between;gap:6px;font-weight:600}.deal .s{color:var(--muted);font-size:13px;margin-top:2px}
.src{font-size:11px;background:var(--bg);border-radius:6px;padding:1px 6px;color:var(--muted)}
select{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;max-width:170px}
.task select{margin-left:auto;font-size:12px;width:150px;flex:none}.task>div{flex:1}.task .x{margin-left:4px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
tr.click{cursor:pointer}tr.click:hover{background:var(--bg)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
input,textarea{width:100%;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
.btn{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:9px 16px;font:inherit;cursor:pointer}.btn.g{background:none;color:var(--text);border:1px solid var(--line)}
.ok{color:var(--ok)}.bad{color:var(--bad)}code,pre{background:var(--bg);border-radius:8px;font:13px ui-monospace,Menlo,monospace}code{padding:2px 6px}pre{padding:12px;overflow:auto;white-space:pre-wrap;word-break:break-all}
#login{max-width:340px;margin:18vh auto;padding:0 16px}h2{margin:0 0 12px}.muted{color:var(--muted)}
details summary{cursor:pointer;color:var(--muted);font-size:13px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:700px){.two{grid-template-columns:1fr}}
.back{margin-bottom:12px}
.step2{display:flex;align-items:center;gap:6px}.step2 .btn{padding:6px 12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:12px}.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.stat .big{font-size:24px;font-weight:700;margin:2px 0}.row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}
.pill{display:inline-block;font-size:11px;border-radius:999px;padding:2px 8px;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.pill.new{color:#b8860b}.pill.paid{color:var(--ok)}.pill.assembling,.pill.shipped{color:#2d6cdf}.pill.delivered{color:var(--ok)}.pill.cancelled{color:var(--bad)}
.stg{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.stg button{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:999px;padding:6px 12px;cursor:pointer;font:inherit;font-size:13px}
.stg button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.task{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}.task:last-child{border:0}
.task input[type=checkbox]{width:18px;height:18px;margin-top:2px;flex:none}.task.done .tt{text-decoration:line-through;color:var(--muted)}
.task .d{font-size:12px;color:var(--muted)}.task .d.late{color:var(--bad);font-weight:600}.task .x{margin-left:auto;border:0;background:none;color:var(--muted);cursor:pointer}
.addt{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.addt input[type=text]{flex:1;min-width:160px}.addt input[type=date]{width:auto}
.badge{background:var(--bad);color:#fff;border-radius:999px;font-size:11px;padding:1px 6px;margin-left:4px}
.lnk{color:var(--acc);cursor:pointer;text-decoration:underline}
</style></head><body>
<script>
/* ДЕМО: вместо сервера — тестовые данные в памяти страницы */
(()=>{
const now=Date.now(),ago=m=>new Date(now-m*60000).toISOString().replace('T',' ').slice(0,19),dd=n=>new Date(now+n*864e5).toISOString().slice(0,10);
const cust=[{id:1,source:'zerno',external_id:'101',name:'Анна К.',username:'anna_k',phone:'+7 900 111-22-33',address:'Москва, Тверская 1',notes:'Любит светлую обжарку, берёт на подарки.',tags:'постоянный'},
{id:2,source:'zerno',external_id:'102',name:'Дмитрий',username:'dmitry_s',phone:'+7 911 222-33-44',address:'СПб, Невский 20',notes:'',tags:''},
{id:3,source:'zerno',external_id:'103',name:'Мария В.',username:'',phone:'',address:'Казань, Баумана 5',notes:'Спросила про оптовые цены.',tags:'опт'}];
const addrs=[{id:1,customer_id:1,label:'Дом',text:'Москва, Тверская 1',is_main:1},{id:2,customer_id:1,label:'Офис',text:'Москва, Арбат 10, офис 4',is_main:0},{id:3,customer_id:2,label:'',text:'СПб, Невский 20',is_main:1},{id:4,customer_id:3,label:'',text:'Казань, Баумана 5',is_main:1}];
const it=(n,q,p)=>({name:n,qty:q,price:p});
const deals=[
{id:1,customer_id:1,source:'zerno',external_id:'7',code:'Z-1042',stage:'new',total:120000,delivery_cost:0,items:[it('Эфиопия Иргачефф · 250 г',1,120000)],address:'Москва, Тверская 1',track:'',note:'',created_at:ago(12)},
{id:2,customer_id:2,source:'zerno',external_id:'6',code:'Z-1041',stage:'paid',total:435000,delivery_cost:25000,items:[it('Колумбия Супремо · 1 кг',1,340000),it('Улун Те Гуан Инь',1,70000)],address:'СПб, Невский 20',track:'',note:'Помол под турку',created_at:ago(95)},
{id:3,customer_id:3,source:'zerno',external_id:'5',code:'Z-1040',stage:'assembling',total:290000,delivery_cost:0,items:[it('Бразилия Сантос · 1 кг',1,290000)],address:'Казань, Баумана 5',track:'',note:'',created_at:ago(400)},
{id:4,customer_id:1,source:'zerno',external_id:'4',code:'Z-1039',stage:'shipped',total:190000,delivery_cost:30000,items:[it('Набор «Дегустация»',1,190000)],address:'Москва, Тверская 1',track:'CDEK 1234567',note:'',created_at:ago(1500)},
{id:6,customer_id:1,source:'zerno',external_id:'2',code:'Z-1030',stage:'delivered',total:95000,delivery_cost:0,items:[it('Колумбия Супремо · 250 г',1,95000)],address:'Москва, Тверская 1',track:'',note:'',created_at:ago(9000)}];
const P=[{id:1,name:'Эфиопия Иргачефф · 250 г',group_key:'Эфиопия Иргачефф',option_label:'250 г',price:120000,stock:40,category:'Кофе',description:'Светлая обжарка: жасмин, бергамот',has_photo:false},
{id:2,name:'Эфиопия Иргачефф · 1 кг',group_key:'Эфиопия Иргачефф',option_label:'1 кг',price:420000,stock:2,category:'Кофе',description:'Светлая обжарка: жасмин, бергамот',has_photo:false},
{id:3,name:'Колумбия Супремо · 250 г',group_key:'Колумбия Супремо',option_label:'250 г',price:95000,stock:40,category:'Кофе',description:'',has_photo:true},
{id:4,name:'Набор «Дегустация»',price:190000,stock:25,category:'Наборы',description:'Три сорта по 100 г',has_photo:false},
{id:5,name:'Улун Те Гуан Инь',price:70000,stock:0,category:'Чай',description:'',has_photo:false}];
let tid=10,pid=10,aid=10;
const team=[{id:1,name:'Женя',linked:1,link_code:null},{id:2,name:'Катя (склад)',linked:1,link_code:null},{id:3,name:'Игорь (курьер)',linked:0,link_code:'7F3A91C2D0'}];
const tasks=[{id:1,customer_id:2,deal_id:2,title:'Собрать и отправить заказ № Z-1041',due:dd(0),done:0,assignee_id:1},
{id:2,customer_id:1,deal_id:4,title:'Проверить доставку заказа № Z-1039',due:dd(-1),done:0,assignee_id:2},
{id:3,customer_id:3,deal_id:3,title:'Позвонить: уточнить оптовый объём',due:dd(2),due_time:'15:00',done:0,assignee_id:1},
{id:4,customer_id:1,deal_id:6,title:'Предложить подписку: кофе каждые 2 недели',due:dd(12),due_time:'12:00',done:0,assignee_id:2}];
const events=[{id:3,at:ago(12),ok:1,status:200,note:'Новая сделка → new',payload:'{"source":"zerno","customer":{"external_id":"101","name":"Анна К."},"order":{"id":"7","code":"Z-1042","status":"pending","total":120000}}'},
{id:2,at:ago(60),ok:1,status:200,note:'Обновление → paid',payload:'{"source":"zerno","order":{"id":"6","status":"paid"}}'},
{id:1,at:ago(61),ok:0,status:401,note:'Неверный секрет',payload:'{"source":"test"}'}];
const J=(d,s=200)=>new Response(JSON.stringify(d),{status:s,headers:{'Content-Type':'application/json'}}),E=(m)=>J({error:m},400);
const cn=id=>cust.find(c=>c.id===id)?.name,dc=id=>deals.find(d=>d.id===id)?.code;
const ST=['new','paid','assembling','shipped','delivered','cancelled'];
window.fetch=async(u,o={})=>{const p=u.replace('/api',''),m=(o.method||'GET'),b=o.body?JSON.parse(o.body):{};let x;
 if(p==='/login'||p==='/logout')return J({ok:true});
 if(p==='/stats'){const pd=deals.filter(d=>!['new','cancelled'].includes(d.stage));return J({today:{n:1,sum:120000},week:{n:3,sum:915000},month:{n:pd.length,sum:pd.reduce((a,d)=>a+d.total,0)},avg:Math.round(pd.reduce((a,d)=>a+d.total,0)/pd.length),paid:pd.length,repeat:33,customers:cust.length,stages:Object.fromEntries(ST.map(s=>[s,deals.filter(d=>d.stage===s).length])),top:[{name:'Колумбия Супремо',qty:2},{name:'Эфиопия Иргачефф',qty:1},{name:'Бразилия Сантос',qty:1}],late:1})}
 if(p==='/deals'&&m==='GET')return J({stages:ST,deals:deals.map(d=>({...d,customer_name:cn(d.customer_id)}))});
 if(p==='/deals'&&m==='POST'){if(!b.items.length)return E('Добавьте хотя бы один товар');const id=deals.length+10;deals.unshift({id,customer_id:b.customer_id,source:'manual',external_id:'m'+id,code:'M-'+(id-9),stage:b.stage,total:b.items.reduce((a,i)=>a+i.qty*i.price,0)+b.delivery_cost,delivery_cost:b.delivery_cost,items:b.items,address:b.address,track:'',note:b.note,created_at:ago(0)});return J({ok:true,id})}
 if(x=p.match(/^\/deals\/(\d+)\/stage$/)){deals.find(d=>d.id==x[1]).stage=b.stage;return J({ok:true})}
 if(x=p.match(/^\/deals\/(\d+)\/items$/)){if(!b.items.length)return E('В заказе должен остаться хотя бы один товар');const d=deals.find(d=>d.id==x[1]);d.items=b.items;d.delivery_cost=b.delivery_cost;d.total=b.items.reduce((a,i)=>a+i.qty*i.price,0)+b.delivery_cost;return J({ok:true,total:d.total,stock:{applied:[{name:b.items[0].name,from:40,to:39}],unknown:[]}})}
 if(x=p.match(/^\/deals\/(\d+)$/)){Object.assign(deals.find(d=>d.id==x[1]),{address:b.address,track:b.track,note:b.note});return J({ok:true})}
 if(p==='/tasks'&&m==='GET')return J({today:dd(0),tasks:[...tasks].sort((a,c)=>a.done-c.done||String(a.due||'9').localeCompare(String(c.due||'9'))).map(t=>({...t,customer_name:cn(t.customer_id),deal_code:dc(t.deal_id)}))});
 if(p==='/tasks'&&m==='POST'){if(!b.title)return E('Напишите, что нужно сделать');tasks.push({id:tid++,customer_id:b.customer_id,deal_id:b.deal_id||null,title:b.title,due:b.due||null,due_time:b.due_time||null,assignee_id:b.assignee_id?+b.assignee_id:null,done:0});return J({ok:true})}
 if(x=p.match(/^\/tasks\/(\d+)\/delete$/)){const i=tasks.findIndex(t=>t.id==x[1]);if(i>=0)tasks.splice(i,1);return J({ok:true})}
 if(x=p.match(/^\/tasks\/(\d+)$/)){const t=tasks.find(t=>t.id==x[1]);if(b.assignee_id!==undefined)t.assignee_id=b.assignee_id?+b.assignee_id:null;else t.done=b.done?1:0;return J({ok:true})}
 if(p==='/customers'&&m==='POST'){if(!b.name)return E('Введите имя клиента');const id=cust.length+10;cust.push({id,source:'manual',external_id:'x'+id,name:b.name,username:'',phone:b.phone,address:b.address,notes:'',tags:''});if(b.address)addrs.push({id:aid++,customer_id:id,label:'',text:b.address,is_main:1});return J({ok:true,id})}
 if(p==='/customers')return J({customers:cust.map(c=>{const ds=deals.filter(d=>d.customer_id===c.id);return {...c,orders:ds.length,spent:ds.filter(d=>!['new','cancelled'].includes(d.stage)).reduce((s,d)=>s+d.total,0),last_order:ds[0]?.created_at}})});
 if(x=p.match(/^\/customers\/(\d+)$/)){const c=cust.find(c=>c.id==x[1]);if(m==='POST'){Object.assign(c,{phone:b.phone,tags:b.tags,notes:b.notes});return J({ok:true})}return J({customer:c,deals:deals.filter(d=>d.customer_id===c.id),tasks:tasks.filter(t=>t.customer_id===c.id),addresses:addrs.filter(a=>a.customer_id===c.id)})}
 if(p==='/addresses'&&m==='GET')return J({addresses:addrs.map(a=>({...a,customer_name:cn(a.customer_id),phone:cust.find(c=>c.id===a.customer_id).phone}))});
 if(p==='/addresses'&&m==='POST'){if(!b.text)return E('Введите адрес');addrs.push({id:aid++,customer_id:b.customer_id,label:b.label||'',text:b.text,is_main:addrs.some(a=>a.customer_id===b.customer_id)?0:1});return J({ok:true})}
 if(x=p.match(/^\/addresses\/(\d+)\/delete$/)){const i=addrs.findIndex(a=>a.id==x[1]);if(i>=0)addrs.splice(i,1);return J({ok:true})}
 if(x=p.match(/^\/addresses\/(\d+)\/main$/)){const a=addrs.find(a=>a.id==x[1]);addrs.filter(y=>y.customer_id===a.customer_id).forEach(y=>y.is_main=+(y===a));return J({ok:true})}
 if(p==='/products'&&m==='GET')return J({products:P,bot:'demo'});
 if(p==='/products'&&m==='POST'){if(!b.name)return E('Укажите название');P.push({id:pid++,name:b.option_label?b.name+' · '+b.option_label:b.name,group_key:b.option_label?b.name:null,option_label:b.option_label||null,price:Math.round(parseFloat(b.price)*100),stock:+b.stock||0,category:b.category,description:b.description,has_photo:false});return J({ok:true})}
 if(x=p.match(/^\/products\/(\d+)(\/delete|\/photo-url)?$/)){const i=P.findIndex(y=>y.id==x[1]);if(x[2]==='/delete'){P.splice(i,1);return J({ok:true})}if(x[2]){P[i].has_photo=true;return J({ok:true})}
   Object.assign(P[i],{name:b.option_label?b.name+' · '+b.option_label:b.name,group_key:b.option_label?b.name:null,option_label:b.option_label||null,price:Math.round(parseFloat(b.price)*100),stock:+b.stock||0,category:b.category,description:b.description});return J({ok:true})}
 if(p==='/team'&&m==='GET')return J({telegram:true,bot:'zerno_crm_bot',team});
 if(p==='/team'&&m==='POST'){team.push({id:team.length+1,name:b.name,linked:0,link_code:'DEMO'+team.length+'X9'});return J({ok:true})}
 if(x=p.match(/^\/team\/(\d+)\/delete$/)){const i=team.findIndex(t=>t.id==x[1]);if(i>=0)team.splice(i,1);return J({ok:true})}
 if(p==='/events')return J({events});
 return J({});};
})();
</script>

<div id="login" hidden><h2>MiniCRM</h2><label>Пароль</label><input id="pw" type="password" autocomplete="current-password"><p id="lerr" class="bad"></p><button class="btn" id="lgo">Войти</button></div>
<div id="app" hidden>
<header><b>MiniCRM</b><button class="tab on" data-t="home">Обзор</button><button class="tab" data-t="board">Заказы</button><button class="tab" data-t="tasks">Задачи<span id="late" class="badge" hidden></span></button><button class="tab" data-t="clients">Клиенты</button><button class="tab" data-t="addr">Адреса</button><button class="tab" data-t="products">Товары</button><button class="tab" data-t="team">Команда</button><button class="tab" data-t="log">Журнал</button><button class="tab" data-t="connect">Подключение</button><span class="sp"></span><button class="tab" id="out">Выйти</button></header>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rub=k=>Math.round(k/100).toLocaleString('ru-RU')+' ₽';
const NAMES={new:'Новый',paid:'Оплачен',assembling:'Собираем',shipped:'Отправлен',delivered:'Доставлен',cancelled:'Отменён'};
const when=s=>{const d=new Date(String(s).replace(' ','T')+'Z');return isNaN(d)?'':d.toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})};
async function api(p,body){const r=await fetch('/api'+p,{method:body?'POST':'GET',headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
  const d=await r.json().catch(()=>({}));if(r.status===401&&p!=='/login'){show(false);throw new Error('вход')}if(!r.ok)throw new Error(d.error||'Ошибка');return d}
function show(on){$('#login').hidden=on;$('#app').hidden=!on}
$('#lgo').onclick=async()=>{try{await api('/login',{password:$('#pw').value});$('#pw').value='';show(true);tab('home')}catch(e){$('#lerr').textContent=e.message}};
$('#pw').onkeydown=e=>{if(e.key==='Enter')$('#lgo').click()};
$('#out').onclick=async()=>{await api('/logout',{});show(false)};
let cur='home',TEAM=[];
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>tab(b.dataset.t));
async function loadTeam(){try{TEAM=(await api('/team')).team}catch{TEAM=[]}}
async function tab(t){await loadTeam();cur=t;document.querySelectorAll('[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  try{await ({home,board,tasks,clients,addr,products,team,log,connect})[t]()}catch(e){if(e.message!=='вход')$('#m').innerHTML=`<div class="panel bad">${esc(e.message)}</div>`}lateBadge()}
async function lateBadge(){try{const d=await api('/tasks');const n=d.tasks.filter(t=>!t.done&&t.due&&t.due<=d.today).length;const el=$('#late');el.hidden=!n;el.textContent=n}catch{}}
const pill=s=>`<span class="pill ${s}">${NAMES[s]}</span>`;
const dmy=d=>String(d).split('-').reverse().join('.');
const dueTxt=(t,today)=>(x=>t.due&&t.due_time?x+' · '+t.due_time:x)(!t.due?'без срока':t.due<today?'просрочено · '+dmy(t.due):t.due===today?'сегодня':dmy(t.due));
const mapLink=a=>'https://yandex.ru/maps/?text='+encodeURIComponent(a);
const taskRow=(t,today,withClient)=>`<div class="task ${t.done?'done':''}"><input type="checkbox" data-done="${t.id}" ${t.done?'checked':''}>
  <div><div class="tt">${esc(t.title)}</div><div class="d ${!t.done&&t.due&&t.due<today?'late':''}">${dueTxt(t,today)}${withClient?` · <span class="lnk" data-cl="${t.customer_id}">${esc(t.customer_name||'клиент')}</span>`:''}</div></div>
  <select data-as="${t.id}" title="Исполнитель"><option value="">— кто сделает —</option>${TEAM.map(m=>`<option value="${m.id}" ${m.id===t.assignee_id?'selected':''}>${esc(m.name)}</option>`).join('')}</select>
  <button class="x" data-tdel="${t.id}" title="Удалить">✕</button></div>`;
function wireTasks(reload){
  document.querySelectorAll('[data-done]').forEach(c=>c.onchange=async()=>{await api('/tasks/'+c.dataset.done,{done:c.checked});reload()});
  document.querySelectorAll('[data-as]').forEach(s=>s.onchange=async()=>{await api('/tasks/'+s.dataset.as,{assignee_id:s.value||null});reload()});
  document.querySelectorAll('[data-tdel]').forEach(b=>b.onclick=async()=>{await api(`/tasks/${b.dataset.tdel}/delete`,{});reload()});
  document.querySelectorAll('[data-cl]').forEach(b=>b.onclick=()=>client(b.dataset.cl));
}
const addForm=()=>`<div class="addt"><input type="text" id="nt_t" placeholder="Новая задача: например, позвонить уточнить адрес"><input type="date" id="nt_d"><input type="time" id="nt_h" title="Напомнить в это время" style="width:auto"><select id="nt_a"><option value="">Кому: мне</option>${TEAM.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('')}</select><button class="btn" id="nt_b">Добавить</button></div>`;
function wireAdd(cid,did,reload){$('#nt_b').onclick=async()=>{try{await api('/tasks',{customer_id:cid,deal_id:did,title:$('#nt_t').value,due:$('#nt_d').value,due_time:$('#nt_h').value,assignee_id:$('#nt_a').value||null});reload()}catch(e){alert(e.message)}}}
const stockNote=s=>!s||s.untracked||s.skipped?'':(s.applied.length?'Остаток в магазине обновлён: '+s.applied.map(a=>a.name.split(' · ')[0]+' '+a.from+'→'+a.to).join(', '):'')+(s.unknown&&s.unknown.length?(s.applied.length?'. ':'')+'Нет в каталоге, склад не менялся: '+s.unknown.join(', '):'');
const rubIn=v=>Math.round(Number(String(v).replace(',','.'))*100)||0;

async function home(){
  const [s,t]=await Promise.all([api('/stats'),api('/tasks')]);
  const card=(l,v,sub)=>`<div class="stat"><div class="muted">${l}</div><div class="big">${v}</div><div class="muted">${sub||''}</div></div>`;
  const open=t.tasks.filter(x=>!x.done&&x.due&&x.due<=t.today).slice(0,6);
  $('#m').innerHTML=`<div class="stats">${card('Сегодня',rub(s.today.sum),s.today.n+' заказ.')}${card('7 дней',rub(s.week.sum),s.week.n+' заказ.')}${card('30 дней',rub(s.month.sum),s.month.n+' заказ.')}${card('Средний чек',rub(s.avg),s.paid+' оплач. заказов')}${card('Повторные',s.repeat+'%','клиентов заказали 2+ раза')}${card('Клиентов',s.customers,'')}</div>
   <div class="two"><div class="panel"><h2>Сейчас в работе</h2>${['new','paid','assembling','shipped'].map(k=>`<div class="row"><span>${NAMES[k]}</span><b>${s.stages[k]}</b></div>`).join('')}
     <p><button class="btn" data-go="board">Открыть заказы</button> <button class="btn g" data-go="neworder">＋ Новый заказ</button></p></div>
    <div class="panel"><h2>Горит</h2>${open.length?open.map(x=>taskRow(x,t.today,true)).join(''):'<div class="muted">Просроченных и сегодняшних задач нет</div>'}</div></div>
   <div class="panel"><h2>Что чаще берут</h2>${s.top.length?s.top.map(x=>`<div class="row"><span>${esc(x.name)}</span><b>${x.qty} шт.</b></div>`).join(''):'<div class="muted">Пока нет оплаченных заказов</div>'}</div>`;

async function newOrder(){

  const prods=p.products||[];let lines=[{name:'',qty:1,price:''}];
  const draw=()=>{$('#lines').innerHTML=lines.map((l,i)=>`<div class="addt"><input type="text" list="pl" data-n="${i}" value="${esc(l.name)}" placeholder="Товар" style="flex:3"><input type="number" min="1" data-q="${i}" value="${l.qty}" style="width:70px"><input type="text" data-p="${i}" value="${esc(l.price)}" placeholder="Цена ₽" style="width:100px"><button class="btn g" data-rm="${i}">✕</button></div>`).join('');
    document.querySelectorAll('[data-n]').forEach(e=>e.onchange=()=>{const i=+e.dataset.n;lines[i].name=e.value;const f=prods.find(x=>x.name===e.value);if(f){lines[i].price=String(f.price/100);e.parentElement.querySelector('[data-p]').value=lines[i].price}sum()});
    document.querySelectorAll('[data-q]').forEach(e=>e.oninput=()=>{lines[+e.dataset.q].qty=+e.value||1;sum()});
    document.querySelectorAll('[data-p]').forEach(e=>e.oninput=()=>{lines[+e.dataset.p].price=e.value;sum()});
    document.querySelectorAll('[data-rm]').forEach(e=>e.onclick=()=>{lines.splice(+e.dataset.rm,1);if(!lines.length)lines=[{name:'',qty:1,price:''}];draw();sum()});sum()};
  const sum=()=>{$('#tot').textContent=rub(lines.reduce((a,l)=>a+l.qty*rubIn(l.price),0)+rubIn($('#nd').value))};
  $('#m').innerHTML=`<button class="btn g back" id="bk">← К заказам</button><div class="panel" style="max-width:760px"><h2>Новый заказ (звонок, Instagram, магазин)</h2>
   <label>Клиент</label><select id="nc" style="max-width:none;width:100%"><option value="">— выберите —</option><option value="new">＋ Новый клиент…</option>${c.customers.map(x=>`<option value="${x.id}">${esc(x.name||'Без имени')}${x.phone?' · '+esc(x.phone):''}</option>`).join('')}</select>

   <div class="two"><div><label>Адрес доставки</label><input id="na"></div><div><label>Доставка, ₽</label><input id="nd" value="0"></div></div>
   <label>Статус</label><select id="ns" style="max-width:none;width:100%">${Object.keys(NAMES).slice(0,5).map(k=>`<option value="${k}">${NAMES[k]}</option>`).join('')}</select>

async function tasks(){
  const d=await api('/tasks');const open=d.tasks.filter(t=>!t.done),done=d.tasks.filter(t=>t.done);
  const late=open.filter(t=>t.due&&t.due<d.today),today=open.filter(t=>t.due===d.today),later=open.filter(t=>!t.due||t.due>d.today);
  const grp=(n,l)=>l.length?`<div class="panel"><h2>${n} (${l.length})</h2>${l.map(t=>taskRow(t,d.today,true)).join('')}</div>`:'';
  $('#m').innerHTML=`<p class="muted">Часть задач CRM ставит сама: «собрать заказ» при оплате, «проверить доставку» при отправке, «спросить отзыв» через 14 дней после доставки.</p>`+
   (open.length||done.length?grp('Просрочено',late)+grp('Сегодня',today)+grp('Позже',later)+(done.length?`<details><summary>Выполнено (${done.length})</summary><div class="panel">${done.slice(0,30).map(t=>taskRow(t,d.today,true)).join('')}</div></details>`:''):'<div class="panel">Задач пока нет.</div>');
  wireTasks(tasks);
}

      <div class="addt"><input type="text" id="aa_t" placeholder="Город, улица, дом, кв."><input type="text" id="aa_l" placeholder="Метка: дом, офис" style="max-width:130px"><button class="btn" id="aa_b">Добавить</button></div></div>
    <div class="panel"><h2>Задачи</h2>${ts.length?ts.map(k=>taskRow(k,today)).join(''):'<div class="muted">Задач нет</div>'}${addForm()}</div></div>
    <div><h2>Заказы (${deals.length})</h2>${deals.map(d=>`<div class="panel" style="cursor:pointer" data-dl="${d.id}"><b>№ ${esc(d.code||d.external_id)}</b> · ${pill(d.stage)} · ${rub(d.total)}<div class="muted">${when(d.created_at)}${d.address?' · 📍 '+esc(d.address):''}${d.track?' · трек '+esc(d.track):''}</div>
      <div>${d.items.map(i=>`${esc(i.name)} × ${i.qty}`).join('<br>')}</div></div>`).join('')}</div></div>`;
  $('#bk').onclick=()=>tab(cur);
  $('#sv').onclick=async()=>{await api('/customers/'+id,{phone:$('#ph').value,address:$('#ad').value,tags:$('#tg').value,notes:$('#nt').value});$('#ok').textContent='Сохранено ✓'};
  $('#aa_b').onclick=async()=>{try{await api('/addresses',{customer_id:c.id,text:$('#aa_t').value,label:$('#aa_l').value});client(id)}catch(e){alert(e.message)}};
  document.querySelectorAll('[data-am]').forEach(b=>b.onclick=async()=>{await api(`/addresses/${b.dataset.am}/main`,{});client(id)});
  document.querySelectorAll('[data-ad]').forEach(b=>b.onclick=async()=>{await api(`/addresses/${b.dataset.ad}/delete`,{});client(id)});
  document.querySelectorAll('[data-dl]').forEach(b=>b.onclick=async()=>deal(b.dataset.dl));
  wireTasks(()=>client(id));wireAdd(c.id,null,()=>client(id));
}
async function addr(){
  const d=await api('/addresses');
  $('#m').innerHTML=`<p style="display:flex;gap:8px;flex-wrap:wrap"><input id="aq" placeholder="Поиск по адресу, клиенту, телефону" style="flex:1;min-width:200px"><a class="btn g" href="/api/addresses.csv" style="text-decoration:none">⬇ CSV</a></p><div id="al"></div>`;
  const draw=()=>{const q=$('#aq').value.trim().toLowerCase();const l=d.addresses.filter(a=>!q||[a.text,a.customer_name,a.phone,a.label].join(' ').toLowerCase().includes(q));
    $('#al').innerHTML=l.length?`<table><tr><th>Адрес</th><th>Клиент</th><th>Телефон</th><th></th></tr>${l.map(a=>`<tr><td>${esc(a.text)} ${a.is_main?'<span class="pill paid">основной</span>':''}<div class="muted">${esc(a.label)}</div></td>
      <td><span class="lnk" data-cl="${a.customer_id}">${esc(a.customer_name||'Без имени')}</span></td><td>${esc(a.phone)}</td><td><a class="lnk" href="${mapLink(a.text)}" target="_blank" rel="noopener">карта</a> · <span class="lnk" data-cp="${esc(a.text)}">копировать</span></td></tr>`).join('')}</table>`:'<div class="panel">Адресов пока нет. Они появятся из заказов, а ещё их можно добавить в карточке клиента.</div>';
    document.querySelectorAll('[data-cl]').forEach(b=>b.onclick=()=>client(b.dataset.cl));
    document.querySelectorAll('[data-cp]').forEach(b=>b.onclick=()=>{navigator.clipboard?.writeText(b.dataset.cp);b.textContent='скопировано ✓'})};
  draw();$('#aq').oninput=draw;
}
async function products(){
  const d=await api('/products');const P=d.products;
  $('#m').innerHTML=`<p style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="np">＋ Новый товар</button><input id="pq" placeholder="Поиск товара" style="flex:1;min-width:200px"></p><div id="pl2"></div>
   <p class="muted">Каталог живёт в боте Zerno: всё, что вы меняете здесь, сразу видно покупателям в магазине. Варианты (250 г / 1 кг) — это отдельные позиции с одним названием и разным «вариантом».</p>`;
  const draw=()=>{const q=$('#pq').value.trim().toLowerCase();const l=P.filter(p=>!q||[p.name,p.category,p.description].join(' ').toLowerCase().includes(q));
    $('#pl2').innerHTML=l.length?`<table><tr><th>Товар</th><th>Категория</th><th>Цена</th><th>Остаток</th><th>Фото</th></tr>${l.map(p=>`<tr class="click" data-p="${p.id}"><td>${esc(p.name)}</td><td>${esc(p.category||'')}</td><td>${rub(p.price)}</td>
      <td>${p.stock<=0?'<span class="bad">нет</span>':p.stock<=3?'<span class="bad">'+p.stock+' · мало</span>':p.stock}</td><td>${p.has_photo?'✓':'<span class="muted">нет</span>'}</td></tr>`).join('')}</table>`:'<div class="panel">Товаров нет.</div>';
    document.querySelectorAll('[data-p]').forEach(r=>r.onclick=()=>edit(P.find(x=>x.id==r.dataset.p)))};
  draw();$('#pq').oninput=draw;$('#np').onclick=()=>edit(null);
  function edit(p0,base){const p=p0||base||{name:'',price:0,stock:0,category:'',description:''};
    const nameBase=p.group_key||p.name, f=(k,l,v,ex='')=>`<label>${l}</label><input id="f_${k}" value="${esc(v??'')}" ${ex}>`;
    $('#m').innerHTML=`<button class="btn g back" id="bk">← К товарам</button><div class="panel" style="max-width:640px"><h2>${p0?'Редактирование':'Новый товар'}</h2>
     ${f('name','Название',nameBase)}${f('option_label','Вариант (например «250 г», пусто — без вариантов)',p.option_label)}
     <div class="two"><div>${f('price','Цена, ₽',p.price?p.price/100:'','inputmode="decimal"')}</div><div>${f('stock','Остаток, шт.',p.stock,'inputmode="numeric"')}</div></div>
     ${f('category','Категория',p.category,'list="cl"')}<datalist id="cl">${[...new Set(P.map(x=>x.category).filter(Boolean))].map(c=>`<option value="${esc(c)}">`).join('')}</datalist>
     <label>Описание</label><textarea id="f_description" rows="3">${esc(p.description||'')}</textarea>
     <details><summary>English (необязательно)</summary>${f('name_en','Name',(p.name_en||'').split(' · ')[0])}${f('option_label_en','Option',p.option_label_en)}${f('category_en','Category',p.category_en)}<label>Description</label><textarea id="f_description_en" rows="2">${esc(p.description_en||'')}</textarea></details>
     ${p0?`<label>Фото по ссылке (https://…)</label><div class="addt"><input type="text" id="f_photo" placeholder="https://…"><button class="btn g" id="fp">Загрузить фото</button></div>${p.photo?'<div class="muted">Фото уже есть. Новая ссылка заменит его.</div>':''}`:'<div class="muted">Фото можно добавить сразу после создания.</div>'}
     <p><button class="btn" id="fs">${p0?'Сохранить':'Создать'}</button> ${p0?'<button class="btn g" id="fv">＋ Добавить вариант</button> <button class="btn g" id="fd">Удалить</button>':''} <span id="er" class="bad"></span></p></div>`;
    const body=()=>Object.fromEntries(['name','option_label','price','stock','category','description','name_en','option_label_en','category_en','description_en'].map(k=>[k,$('#f_'+k).value]));
    $('#bk').onclick=products;
    $('#fs').onclick=async()=>{try{if(p0)await api('/products/'+p0.id,body());else await api('/products',body());products()}catch(e){$('#er').textContent=e.message}};
    if(p0){$('#fd').onclick=async()=>{if(!confirm('Удалить товар? Он пропадёт из магазина и корзин.'))return;await api(`/products/${p0.id}/delete`,{});products()};
      $('#fp').onclick=async()=>{try{await api(`/products/${p0.id}/photo-url`,{url:$('#f_photo').value});products()}catch(e){$('#er').textContent=e.message}};
      $('#fv').onclick=()=>edit(null,{...p,id:undefined,option_label:'',option_label_en:'',name:nameBase,stock:0})}}
}
async function team(){
  const d=await api('/team');TEAM=d.team;
  $('#m').innerHTML=`<div class="panel"><h2>Команда и напоминания в Telegram</h2>
   ${d.telegram?'<p class="ok">✓ Бот-напоминатель подключён.</p>':'<p class="bad">Бот-напоминатель не подключён: задайте в настройках сервера <code>CRM_TG_TOKEN</code> (токен бота из @BotFather) и <code>CRM_TG_BOT</code> (его @имя).</p>'}
   <p class="muted">Добавьте себя и коллег. Каждый один раз отправляет боту ${d.bot?'<b>@'+esc(d.bot)+'</b>':'бот-напоминатель'} сообщение <code>/start КОД</code> — и дальше получает свои задачи: утреннюю сводку в 9:00, напоминание в назначенное время и сразу при назначении. Под сообщением есть кнопка «Выполнено». Задачи без исполнителя приходят первому подключённому сотруднику (владельцу).</p>
   ${d.team.length?`<table><tr><th>Имя</th><th>Telegram</th><th></th></tr>${d.team.map(m=>`<tr><td>${esc(m.name)}</td><td>${m.linked?'<span class="ok">✓ подключён</span>':`ждёт: отправьте боту <code>/start ${esc(m.link_code)}</code>`}</td>
     <td style="text-align:right"><button class="btn g" data-rl="${m.id}">Привязать заново</button> <button class="btn g" data-tm="${m.id}">Удалить</button></td></tr>`).join('')}</table>`:'<div class="muted">Пока никого нет.</div>'}
   <div class="addt"><input type="text" id="tm_n" placeholder="Имя сотрудника"><button class="btn" id="tm_b">Добавить</button></div></div>`;
  $('#tm_b').onclick=async()=>{try{await api('/team',{name:$('#tm_n').value});team()}catch(e){alert(e.message)}};
  document.querySelectorAll('[data-tm]').forEach(b=>b.onclick=async()=>{await api(`/team/${b.dataset.tm}/delete`,{});team()});
  document.querySelectorAll('[data-rl]').forEach(b=>b.onclick=async()=>{await api(`/team/${b.dataset.rl}/relink`,{});team()});
}
async function log(){
  const d=await api('/events');
  $('#m').innerHTML=`<p class="muted">Каждый запрос от бота. Зелёный — принят, красный — отклонён (например, неверный секрет). Нажмите «данные», чтобы увидеть, что именно прислал бот.</p>`+
   (d.events.length?`<table><tr><th>Когда</th><th></th><th>Что произошло</th></tr>${d.events.map(e=>`<tr><td>${when(e.at)}</td><td class="${e.ok?'ok':'bad'}">${e.ok?'✓':'✕'} ${e.status}</td><td>${esc(e.note)}<details><summary>данные</summary><pre>${esc(e.payload)}</pre></details></td></tr>`).join('')}</table>`:'<div class="panel">Запросов ещё не было.</div>');
}
function connect(){
  const u=location.origin+'/api/webhook/order';
  const ex=JSON.stringify({source:'zerno',customer:{external_id:'12345',name:'Анна',username:'anna'},order:{id:'101',code:'A-101',status:'paid',total:215000,delivery_cost:30000,address:'Москва, Тверская 1',items:[{name:'Эфиопия Иргачефф · 250 г',qty:1,price:120000},{name:'Колумбия Супремо · 250 г',qty:1,price:95000}]}},null,2);
  $('#m').innerHTML=`<div class="panel"><h2>Как бот отправляет заказ сюда</h2>
   <p>Бот делает <b>POST</b>-запрос на адрес ниже и кладёт секрет в заголовок <code>X-Webhook-Secret</code>. Деньги указываются в копейках.</p>
   <label>Адрес</label><pre>${esc(u)}</pre>
   <label>Что отправляет бот (JSON)</label><pre>${esc(ex)}</pre>
   <label>Статусы</label><p>${Object.keys(NAMES).map(k=>`<code>${k}</code>`).join(' ')} — они же колонки воронки. Тот же заказ с новым статусом двигает карточку.</p>
   <label>Проверить вручную (в терминале)</label><pre>curl -X POST ${esc(u)} \\
  -H "Content-Type: application/json" -H "X-Webhook-Secret: ВАШ_СЕКРЕТ" \\
  -d '${esc(ex.replace(/\n\s*/g,' '))}'</pre>
   <p class="muted">Потом откройте «Воронка» и «Журнал» — заказ и сам запрос будут там.</p></div>`;
}
(async()=>{try{await api('/events');show(true);tab('home')}catch{show(false)}})();
</script></body></html>
