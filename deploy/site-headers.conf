# Заголовки сайта-портфолио botforall.ru (не для поддоменов ботов: их мини-приложения открываются внутри Telegram).
# CSP: скрипты, стили, шрифты и картинки — только свои; 'unsafe-inline' у стилей нужен для style="…" из React.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# nginx: add_header внутри location отменяет унаследованные — поэтому общие заголовки повторяем здесь же
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000" always;
